name: assignment-test

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '*'

jobs:
  full-test:
    container: cuaesd/aesd-autotest:24-assignment4-buildroot
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v2

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Refresh GitHub SSH host key
        run: |
          mkdir -p /root/.ssh
          ssh-keygen -f /root/.ssh/known_hosts -R github.com || true
          ssh-keyscan github.com >> /root/.ssh/known_hosts

      - name: Test GitHub SSH access
        run: |
          ssh -o StrictHostKeyChecking=no -T git@github.com || true
          git ls-remote git@github.com:cu-ecen-aeld/assignments-3-and-later-PeanutButtermitKase.git HEAD


      - name: Run full test
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        run: ./full-test.sh

      - name: Cleanup
        if: always()
        run: |
          ssh-add -D || true